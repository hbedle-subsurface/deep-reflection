<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=Special+Elite&display=swap">
<link rel="stylesheet" href="../assets/glossary.css">
<link rel="stylesheet" href="../css/style.css">
<title>Open the line </title>
</head>
<body>
<script>
/* If a script fails to load or throws, say so on the page instead of leaving
   it half drawn: usually a file missing from the server or an old copy held
   in the browser cache. */
(function(){
  function show(msg){
    var d = document.getElementById("loadfail");
    if (!d){ d = document.createElement("div"); d.id = "loadfail";
      d.style.cssText = "position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;background:#fbf7ea;color:#2b1d10;border-left:5px solid #a3261c;padding:10px 14px;font:14px/1.4 Arial,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.4)";
      d.innerHTML = "<b>The page did not load completely.</b> A hard refresh (Ctrl+Shift+R, or Cmd+Shift+R on a Mac) clears an old copy from the browser cache; if that does not help, a file is missing from the site.<ul style='margin:6px 0 0 18px;padding:0'></ul>";
      (document.body || document.documentElement).appendChild(d); }
    var li = document.createElement("li"); li.textContent = msg; d.querySelector("ul").appendChild(li);
  }
  window.addEventListener("error", function(e){
    var t = e.target;
    // only this site's own scripts: the page counter is often blocked by
    // privacy settings, which does not affect the tool
    if (t && t !== window && (t.src || t.href)){ if (t.tagName === "SCRIPT" && t.src.indexOf(location.origin) === 0) show("Not found: " + t.src); return; }
    if (e.filename && e.filename.indexOf(location.origin) !== 0) return;
    show(e.message + (e.filename ? " (" + e.filename.split("/").pop() + ", line " + e.lineno + ")" : ""));
  }, true);
  window.addEventListener("unhandledrejection", function(e){ show(String(e.reason && e.reason.message || e.reason)); });
})();
</script>
<div class="dash">
  <aside class="side" id="side">
    <h2>The file<button class="help" data-help="load">Learn more</button></h2>
    <div id="fileInfo" class="hint"></div>

    <h2>Trace spacing</h2>
    <div id="spacingBox"></div>

    <h2>Crop</h2>
    <div class="guide"><p>With "Drag to crop" chosen above the section, a box dragged on it
    sets the part of the line that every later step works on. The fields below give the same crop in numbers.</p></div>
    <div class="row2">
      <label>First trace<input type="number" id="ci0" min="0" step="1"></label>
      <label>Last trace<input type="number" id="ci1" min="0" step="1"></label>
      <label>Start, ms<input type="number" id="cj0" min="0" step="2"></label>
      <label>End, ms<input type="number" id="cj1" min="0" step="2"></label>
    </div>
    <div class="btnrow"><button id="btnWhole">Crop to the whole line</button></div>
    <p class="hint" id="cropNote"></p>
  </aside>

  <main class="stage" id="stage">
    <div class="status"><span id="where"></span><span class="busy" id="busy" hidden></span></div>
    <div class="panels" id="panels"></div>
    <div class="note" id="note"></div>
    <div id="headers"></div>
    <div id="next"></div>
  </main>
</div>

<script src="../js/site.js"></script>
<script src="../js/vmodel.js"></script>
<script src="../js/store.js"></script>
<script src="../js/display.js"></script>
<script src="../js/help.js"></script>
<script src="../js/glossary.js"></script>
<script src="../js/common.js"></script>
<script>
let RAW = null, CROP = null;

(async function init(){
  await pageShell("line");
  if (!LINE){ emptyState($("stage"), "No line is open."); return; }
  RAW = sectionOf(await stageLoad("raw"));
  if (!RAW){ emptyState($("stage"), "The stored line could not be read."); return; }
  CROP = await kvGet("crop") || {i0: 0, i1: RAW.nx - 1, j0: 0, j1: RAW.ns - 1};

  const recS = (LINE.ns - 1) * LINE.dt * 1e-6;
  $("fileInfo").innerHTML =
    "<b>" + LINE.name + "</b><br>" +
    LINE.nx + " traces" + (LINE.step > 1 ? " (every " + LINE.step + "th of " + LINE.ntrFile + ", to stay within browser memory)" : "") +
    "<br>" + LINE.ns + " samples at " + (LINE.dt / 1000) + " ms, " + recS.toFixed(2) + " s of record" +
    "<br>First sample at " + (LINE.delayMs || 0) + " ms" +
    "<br>CDP " + LINE.cdp0 + " to " + LINE.cdp1;

  if (LINE.dist){
    $("spacingBox").innerHTML = '<p class="hint">Distance is taken from the CDP coordinates in the trace headers: ' +
      (LINE.dist[LINE.dist.length - 1] / 1000).toFixed(2) + " km along the line, " +
      (LINE.dist[LINE.dist.length - 1] / Math.max(1, LINE.nx - 1)).toFixed(1) + " m between traces on average.</p>";
  } else {
    $("spacingBox").innerHTML =
      '<p class="hint">The trace headers carry no usable coordinates, so the distance axis uses a spacing entered here.</p>' +
      '<label>Trace spacing, m<input type="number" id="dx" min="0.5" step="0.5" value="' + (LINE.dx || SITE.defaultDx) + '"></label>';
    if (!LINE.dx){ LINE.dx = SITE.defaultDx; await kvSet("line", LINE); }
    $("dx").addEventListener("change", async () => {
      LINE.dx = Math.max(0.5, +$("dx").value || SITE.defaultDx);
      await kvSet("line", LINE);
      redraw();
    });
  }

  const smp = LINE.sampleId && SITE.samples.find(x => x.id === LINE.sampleId);
  if (smp && (smp.notes || smp.figures)){
    const c = document.createElement("div");
    c.className = "card";
    c.innerHTML = "<h2>About this line</h2>" +
      (smp.notes || []).map(t => '<p class="guide">' + t + "</p>").join("") +
      (smp.figures || []).map(f => '<figure class="fig"><img src="../' + f.src + '" alt="" onclick="window.open(this.src)" onerror="this.parentElement.remove()">' +
        "<figcaption>" + f.cap + ' <span class="credit">' + f.credit + "</span></figcaption></figure>").join("") +
      (smp.refs && smp.refs.length ? '<h3>References</h3><ul class="refs">' + smp.refs.map(r => "<li>" + r + "</li>").join("") + "</ul>" : "");
    $("side").append(c);
  }
  if (SITE.depthScale) velocityCard();
  displayControls($("side"), redraw);
  makePanel($("panels"), "sec", "The line as read", {height: 420});
  attachReadout("sec");
  enableBox("sec", box => setCrop(box));
  viewBar($("stage"), "crop", {cropBox: () => CROP});
  onView(redraw);

  writeHeaders();
  syncFields();
  redraw();
  $("next").innerHTML = nextLink("line");
  glossaryScan(document.body);
})();

/* The 1D velocity model behind the depth scale. A reference model is chosen,
   a sediment layer can be put on top, and the crustal layers can be edited;
   editing turns the model into a custom one. */
function velocityCard(){
  const c = document.createElement("div");
  c.className = "card";
  c.innerHTML = '<h2>Depth scale<button class="help" data-help="vmodel">Learn more</button></h2>' +
    '<label>Reference model<select id="vmBase">' + Object.entries(VMODELS).map(([k, m]) => '<option value="' + k + '">' + m.name + "</option>").join("") + "</select></label>" +
    '<div class="row2"><label>Sediments, km<input type="number" id="vmSedH" min="0" max="15" step="0.5"></label>' +
    '<label>at km/s<input type="number" id="vmSedV" min="1.5" max="5.5" step="0.1"></label></div>' +
    '<h3>Crust</h3><div class="row2">' +
    '<label>Upper, km<input type="number" id="vmH1" min="1" max="60" step="0.5"></label><label>at km/s<input type="number" id="vmV1" min="4" max="7.5" step="0.05"></label>' +
    '<label>Lower, km<input type="number" id="vmH2" min="1" max="60" step="0.5"></label><label>at km/s<input type="number" id="vmV2" min="5" max="8" step="0.05"></label>' +
    '<label>Mantle, km/s<input type="number" id="vmVm" min="7" max="9" step="0.01"></label></div>' +
    '<div class="btnrow"><button id="vmReset">Back to the reference model</button></div>' +
    '<p class="hint" id="vmInfo"></p>';
  $("side").append(c);
  const fill = () => {
    const ref = VMODEL.custom || VMODELS[VMODEL.base];
    $("vmBase").value = VMODEL.base; $("vmSedH").value = VMODEL.sedH; $("vmSedV").value = VMODEL.sedV;
    $("vmH1").value = ref.layers[0].h; $("vmV1").value = ref.layers[0].v;
    $("vmH2").value = ref.layers[1].h; $("vmV2").value = ref.layers[1].v; $("vmVm").value = ref.mantle;
    const mz = mohoDepth(VMODEL), mt = timeAtDepth(mz, VMODEL), tEnd = secAt(LINE.ns - 1);
    $("vmInfo").textContent = vmodelLabel(VMODEL) + ". Moho at " + mz.toFixed(1) + " km, " + mt.toFixed(1) +
      " s two-way time. The record ends at " + tEnd.toFixed(1) + " s, about " + depthAtTime(tEnd, VMODEL).toFixed(0) + " km.";
  };
  const save = async () => { await kvSet("vmodel", VMODEL); fill(); redraw(); };
  fill();
  $("vmBase").addEventListener("change", () => { VMODEL.base = $("vmBase").value; VMODEL.custom = null; save(); });
  ["vmSedH", "vmSedV"].forEach(k => $(k).addEventListener("change", () => { VMODEL.sedH = Math.max(0, +$("vmSedH").value || 0); VMODEL.sedV = +$("vmSedV").value || 3.5; save(); }));
  ["vmH1", "vmV1", "vmH2", "vmV2", "vmVm"].forEach(k => $(k).addEventListener("change", () => {
    VMODEL.custom = {layers: [{h: +$("vmH1").value, v: +$("vmV1").value}, {h: +$("vmH2").value, v: +$("vmV2").value}], mantle: +$("vmVm").value};
    save();
  }));
  $("vmReset").addEventListener("click", () => { VMODEL.custom = null; VMODEL.sedH = 0; save(); });
}

function redraw(){
  if (!RAW) return;
  drawSeis("sec", RAW, RAW.data);
  drawBoxOverlay("sec", CROP, RAW, true);
  const km = kmAt(CROP.i1) - kmAt(CROP.i0);
  $("where").innerHTML = "Crop: <b>" + (CROP.i1 - CROP.i0 + 1) + " traces</b>, " + fmt(km, 1) + " km, " +
    fmt(secAt(CROP.j0), 2) + " to " + fmt(secAt(CROP.j1), 2) + " s";
  const cells = (CROP.i1 - CROP.i0 + 1) * (CROP.j1 - CROP.j0 + 1);
  $("note").innerHTML = "<p>The dashed box is the crop. Every later step, including the attributes " +
    "and the self-organizing map, runs on the " + (cells / 1e6).toFixed(2) + " million samples inside it. " +
    "The darkened area outside it is left out.</p>";
}

function syncFields(){
  const ms = j => Math.round(secAt(j) * 1000);
  $("ci0").value = CROP.i0; $("ci1").value = CROP.i1;
  $("cj0").value = ms(CROP.j0); $("cj1").value = ms(CROP.j1);
}

async function setCrop(box){
  const b = {i0: Math.max(0, box.i0), i1: Math.min(RAW.nx - 1, box.i1),
             j0: Math.max(0, box.j0), j1: Math.min(RAW.ns - 1, box.j1)};
  if (b.i1 - b.i0 < 16 || b.j1 - b.j0 < 32){ $("cropNote").textContent = "That crop is too small to filter or classify."; return; }
  CROP = b; syncFields(); redraw();
  setBusy("Storing the crop…");
  await nextFrame();
  const nx = b.i1 - b.i0 + 1, ns = b.j1 - b.j0 + 1;
  const d = new Float32Array(nx * ns);
  for (let i = 0; i < nx; i++) d.set(RAW.data.subarray((b.i0 + i) * RAW.ns + b.j0, (b.i0 + i) * RAW.ns + b.j0 + ns), i * ns);
  await stageSave("crop", {data: d, nx, ns, dt: RAW.dt, j0: b.j0}, {i0: b.i0});
  await stageDropAfter("crop");
  await kvSet("crop", b);
  await kvDelete("band");
  setBusy("");
  $("cropNote").textContent = "Crop stored. Results from later steps made on the previous crop have been cleared.";
}

function fromFields(){
  const toJ = ms => Math.round((ms / 1000 - (LINE.delayMs || 0) / 1000) / (LINE.dt * 1e-6));
  setCrop({i0: +$("ci0").value, i1: +$("ci1").value, j0: toJ(+$("cj0").value), j1: toJ(+$("cj1").value)});
}
["ci0", "ci1", "cj0", "cj1"].forEach(k => $(k).addEventListener("change", fromFields));
$("btnWhole").addEventListener("click", () => setCrop({i0: 0, i1: RAW.nx - 1, j0: 0, j1: RAW.ns - 1}));
window.addEventListener("resize", debounce(redraw, 200));

function writeHeaders(){
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  let h = '<div class="figrow"><div><h3>Textual header</h3><pre class="ebcdic">' +
    esc(LINE.textual.join("\n")) + "</pre></div>";
  h += '<div><h3>Binary header</h3><table class="data">' +
    Object.entries(LINE.binary).map(([k, v]) => "<tr><th>" + k + "</th><td>" + v + "</td></tr>").join("") +
    "</table></div></div>";
  h += '<h3 style="font-size:.84rem;margin:1rem 0 .2rem;font-family:var(--display)">First trace headers</h3>' +
    '<table class="data"><tr><th>Trace (1)</th><th>CDP (21)</th><th>Scalar (71)</th><th>CDP X (181)</th>' +
    "<th>CDP Y (185)</th><th>Delay, ms (109)</th><th>Samples (115)</th><th>Interval, µs (117)</th></tr>" +
    LINE.traceRows.map(r => "<tr><td>" + [r.seq, r.cdp, r.scalar, r.x, r.y, r.delay, r.ns, r.dt].join("</td><td>") + "</td></tr>").join("") +
    "</table>";
  $("headers").innerHTML = h;
}
</script>
<script src="../assets/count.js"></script>
</body>
</html>
